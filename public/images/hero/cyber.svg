<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" class="animated">
<style>
.animated .burst{animation:hero-fade .5s cubic-bezier(0.22,1,0.36,1) .2s both}
.animated .shield{animation:hero-fade .7s cubic-bezier(0.22,1,0.36,1) .28s both}
.animated .card{animation:hero-fade .5s cubic-bezier(0.22,1,0.36,1) both}
.animated .bob-b{animation:hero-float 18s ease-in-out -4s infinite;transform-box:fill-box;transform-origin:center}
.animated .bob-d{animation:hero-float 22s ease-in-out -8s infinite;transform-box:fill-box;transform-origin:center}
.animated .bob-b.late{animation-duration:20s;animation-delay:-11s}
@keyframes hero-fade{from{opacity:0}to{opacity:1}}
@keyframes hero-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
@media (prefers-reduced-motion:reduce){.animated *{animation:none!important}}
</style>
